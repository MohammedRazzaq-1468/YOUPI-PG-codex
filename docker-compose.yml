# =============================================================================
# YOUPI PG — Docker Compose (Development)
#
# Usage:
#   docker compose up          # start all services
#   docker compose up -d       # detached
#   docker compose down -v     # stop & remove volumes
#
# For production set NODE_ENV=production & configure CLOUDFLARE_DOMAIN.
# =============================================================================

services:
  # ─── All-in-one gateway (uses the internal process supervisor) ─────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: youpi-pg:latest
    container_name: youpi-pg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      YOUPI_MODE: ${YOUPI_MODE:-localhost}
      # Override localhost URLs to use the internal container hostname.
      BASE_PAYMENT_API_URL: http://localhost:6100
      BASE_CHECKOUT_URL: http://localhost:7000
      BASE_ADMIN_URL: http://localhost:6001
      USE_SQLITE_FALLBACK: ${USE_SQLITE_FALLBACK:-true}
      SQLITE_DB_PATH: /app/data/youpi_pg.sqlite
      CONTROL_CENTER_PORT: ${CONTROL_CENTER_PORT:-8090}
      PAYMENT_API_PORT: ${PAYMENT_API_PORT:-6100}
      CHECKOUT_PORTAL_PORT: ${CHECKOUT_PORTAL_PORT:-7000}
      MERCHANT_ADMIN_PORT: ${MERCHANT_ADMIN_PORT:-6001}
      GMAIL_OBSERVER_PORT: ${GMAIL_OBSERVER_PORT:-6003}
      SMS_OBSERVER_PORT: ${SMS_OBSERVER_PORT:-6002}
      COIN_WALLET_STORE_PORT: ${COIN_WALLET_STORE_PORT:-5000}
    ports:
      - "${PAYMENT_API_PORT:-6100}:6100"       # Payment Core REST API
      - "${CHECKOUT_PORTAL_PORT:-7000}:7000"   # Checkout Portal (youpi.js iframe)
      - "${MERCHANT_ADMIN_PORT:-6001}:6001"    # Merchant Admin Hub
      - "${GMAIL_OBSERVER_PORT:-6003}:6003"    # Gmail Observer / OAuth
      - "${SMS_OBSERVER_PORT:-6002}:6002"      # SMS / Google Messages Observer
      - "${COIN_WALLET_STORE_PORT:-5000}:5000" # Demo Coin Wallet Store
      - "8090:8090"                            # Process Control Center (internal)
    volumes:
      - youpi-data:/app/data                   # Persistent SQLite database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    command: node scripts/dev.js

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  youpi-data:
    driver: local
