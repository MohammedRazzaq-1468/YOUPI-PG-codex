<!-- TOP HEADER -->
<header>
  <div class="brand-group">
    <div class="brand-title">
      <span>🛡️ YOUPI PG</span>
    </div>
    <span class="brand-badge">Merchant &amp; Supervisor Hub</span>
  </div>

  <div class="header-quick-stats">
    <!-- Real Light / Dark Mode Toggle Pill -->
    <div
      class="theme-mode-pill"
      id="headerThemeBadge"
      onclick="toggleThemeManual()"
      title="Auto-switches to Dark Mode in Developer Hub and Bright White Mode in Operations &amp; Store Settings. Click to toggle manually anytime."
    >
      <span id="headerThemeIcon">☀️</span>
      <span id="headerThemeText">Bright White</span>
    </div>

    <!-- YOUPI Store Port 5000 Switch Badge -->
    <div
      class="store-switch-badge is-offline"
      id="headerStoreBadge"
      onclick="toggleYoupiStore()"
      title="Click to 1-Click Enable/Disable YOUPI Showcase Store on Port 5000"
    >
      <span id="headerStoreDot">●</span>
      <span id="headerStoreText">Store (5000): Checking...</span>
    </div>

    <!-- Active VPA Display -->
    <span
      class="badge badge-info"
      id="accountVpaDisplay"
      style="cursor: pointer"
      onclick="switchSection('storeSettings', 'subTabVpa')"
    >
      VPA: Loading...
    </span>

    <!-- Environment Mode -->
    <div
      style="
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--bg-card);
        padding: 0.3rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid var(--border);
        cursor: pointer;
      "
      onclick="switchSection('developerHub', 'subViewDevCloudflare')"
    >
      <span
        style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700"
        >ENV:</span
      >
      <span
        class="badge badge-info"
        id="headerEnvBadge"
        style="font-size: 0.72rem; padding: 0.15rem 0.5rem"
        >💻 LOCALHOST</span
      >
    </div>

    <!-- Live Polling Indicator -->
    <div class="live-pulse-badge">
      <div class="pulse-dot"></div>
      <span>Live Syncing</span>
    </div>
  </div>
</header>

<!-- MAIN NAVIGATION BAR: 3 HIGH-LEVEL SECTIONS -->
<nav class="main-nav-bar">
  <button
    class="main-nav-btn active"
    id="mainNavOperations"
    onclick="switchSection('operations')"
  >
    <span>🏪</span>
    <span>Daily Merchant Operations</span>
  </button>
  <button
    class="main-nav-btn"
    id="mainNavStoreSettings"
    onclick="switchSection('storeSettings')"
  >
    <span>⚙️</span>
    <span>Store Settings</span>
  </button>
  <button
    class="main-nav-btn"
    id="mainNavDeveloperHub"
    onclick="switchSection('developerHub')"
  >
    <span>🛠️</span>
    <span>Developer &amp; Infrastructure Hub</span>
  </button>
  <button
    class="main-nav-btn"
    id="mainNavSecurity"
    onclick="switchSection('security')"
  >
    <span>🛡️</span>
    <span>Security fucker</span>
  </button>
</nav>

<!-- SECONDARY SUB-NAVIGATION BAR (Dynamically adapts per section) -->
<nav class="sub-nav-bar" id="subNavBar">
  <!-- Filled dynamically or toggled based on current section -->
</nav>
